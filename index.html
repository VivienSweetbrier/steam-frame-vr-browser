<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Frame - WebXR VR Video Browser POC</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: rgba(22, 27, 34, 0.85);
            --accent-color: #66c0f4;
            --text-color: #f3f4f6;
            --border-color: #2a3544;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 380px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 4px 0;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 16px;
        }

        .control-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        input[type="text"], select, input[type="file"] {
            width: 100%;
            padding: 8px 12px;
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 10px 14px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        #vr-btn {
            background: #10b981;
            color: #fff;
            font-size: 0.9rem;
        }

        #drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 10px;
            cursor: pointer;
        }

        #drop-zone:hover {
            border-color: var(--accent-color);
            color: #fff;
        }

        #status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(102, 192, 244, 0.2);
            color: var(--accent-color);
            margin-bottom: 12px;
        }
    </style>
    <!-- Three.js + WebXR Polyfill -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/VRButton.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <h1>🥽 Steam Frame VR Video Browser</h1>
        <div class="subtitle">WebXR Immersive Video Player (180° / 360° / Cinema)</div>
        <div id="status-badge">WebXR Engine: Ready</div>

        <div class="control-group">
            <label>Video Source URL or File</label>
            <input type="text" id="video-url" placeholder="https://.../video.mp4" value="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">
            <div id="drop-zone" onclick="document.getElementById('file-input').click()">
                📁 Drag & Drop local video or click to browse
                <input type="file" id="file-input" accept="video/*" style="display:none">
            </div>
        </div>

        <div class="control-group">
            <label>Projection Mode</label>
            <select id="projection-mode">
                <option value="cinema">🎬 Flat Cinema Screen</option>
                <option value="vr180" selected>🌐 180° VR Equirectangular</option>
                <option value="vr360">🌌 360° VR Full Sphere</option>
            </select>
        </div>

        <div class="control-group">
            <label>Stereo 3D Mode</label>
            <select id="stereo-mode">
                <option value="mono" selected>2D / Mono</option>
                <option value="sbs">Side-by-Side (3D SBS)</option>
                <option value="ou">Over-Under (3D OU)</option>
            </select>
        </div>

        <div class="button-row">
            <button id="load-btn">▶ Play Video</button>
            <button id="vr-btn">🥽 Enter VR</button>
        </div>
    </div>

    <!-- Hidden Video Element for Texture Processing -->
    <video id="video-element" crossorigin="anonymous" playsinline style="display:none"></video>

    <script>
        let scene, camera, renderer, controls;
        let video, videoTexture, videoMesh;
        let currentProjection = 'vr180';
        let currentStereo = 'mono';

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Three.js Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x06080c);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0); // Eye height

            // 3. Renderer Setup with WebXR Support
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // 4. Orbit Controls (for desktop testing)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.6, -2);
            controls.update();

            // 5. Ambient Grid Light
            const gridHelper = new THREE.GridHelper(30, 30, 0x2a3544, 0x161b22);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            // 6. Video Element & Texture Setup
            video = document.getElementById('video-element');
            videoTexture = new THREE.VideoTexture(video);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;
            videoTexture.format = THREE.RGBFormat;

            // 7. Setup VR Button using WebXR API
            const vrBtnContainer = document.getElementById('vr-btn');
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        document.getElementById('status-badge').innerText = "WebXR: Steam Frame Connected";
                        vrBtnContainer.onclick = () => {
                            navigator.xr.requestSession('immersive-vr').then(onVRSessionStarted);
                        };
                    } else {
                        document.getElementById('status-badge').innerText = "WebXR: Desktop Emulation Mode";
                        vrBtnContainer.innerText = "Desktop 3D Preview";
                    }
                });
            }

            // 8. Event Listeners
            document.getElementById('load-btn').addEventListener('click', loadVideoFromInput);
            document.getElementById('projection-mode').addEventListener('change', (e) => {
                currentProjection = e.target.value;
                updateGeometry();
            });
            document.getElementById('file-input').addEventListener('change', handleFileSelect);

            window.addEventListener('resize', onWindowResize);

            // Create initial screen geometry
            updateGeometry();
            renderer.setAnimationLoop(render);
        }

        function updateGeometry() {
            if (videoMesh) scene.remove(videoMesh);

            let geometry, material;

            if (currentProjection === 'cinema') {
                // Curved Cinema Screen Geometry
                geometry = new THREE.CylinderGeometry(5, 5, 4, 32, 1, true, -Math.PI / 4, Math.PI / 2);
                geometry.scale(-1, 1, 1); // Face inwards
                material = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
                videoMesh = new THREE.Mesh(geometry, material);
                videoMesh.position.set(0, 1.6, -2);
            } 
            else if (currentProjection === 'vr180') {
                // 180 Equirectangular Dome
                geometry = new THREE.SphereGeometry(100, 64, 32, -Math.PI / 2, Math.PI, 0, Math.PI);
                geometry.scale(-1, 1, 1); // Invert normals for inside viewing
                material = new THREE.MeshBasicMaterial({ map: videoTexture });
                videoMesh = new THREE.Mesh(geometry, material);
                videoMesh.position.set(0, 1.6, 0);
            } 
            else if (currentProjection === 'vr360') {
                // 360 Full Sphere
                geometry = new THREE.SphereGeometry(100, 64, 32);
                geometry.scale(-1, 1, 1); // Invert normals
                material = new THREE.MeshBasicMaterial({ map: videoTexture });
                videoMesh = new THREE.Mesh(geometry, material);
                videoMesh.position.set(0, 1.6, 0);
            }

            scene.add(videoMesh);
        }

        function loadVideoFromInput() {
            const url = document.getElementById('video-url').value;
            if (!url) return;

            video.src = url;
            video.play().then(() => {
                document.getElementById('status-badge').innerText = "Status: Playing (" + currentProjection.toUpperCase() + ")";
            }).catch(err => {
                console.error("Playback error:", err);
                alert("Error playing video URL. Check CORS or URL validity.");
            });
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const fileURL = URL.createObjectURL(file);
            video.src = fileURL;
            video.play().then(() => {
                document.getElementById('status-badge').innerText = "Status: Playing Local File (" + file.name + ")";
            });
        }

        function onVRSessionStarted(session) {
            renderer.xr.setSession(session);
            document.getElementById('ui-overlay').style.display = 'none'; // Hide desktop UI in VR
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
